<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>jeScores - Every Goal. Every Update.</title>
<meta name="theme-color" content="#0a2e1c">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<style>
:root{--green:#0a2e1c;--green2:#123d26;--gold:#e8b84b;--dark:#080808;--card:#111;--card2:#181818;--border:#1e3d2a;--text:#fff;--muted:#7a7a7a}
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,sans-serif}
body{background:var(--dark);color:var(--text)}
:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
header{background:linear-gradient(135deg,var(--green),var(--green2));padding:10px 12px;display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:100;border-bottom:2px solid var(--gold)}
.logo{font-weight:900;font-size:20px;line-height:1;min-width:90px}.je{color:var(--gold)}.scores{color:#fff}
.logo small{display:block;font-size:6px;letter-spacing:1.8px;color:var(--gold);font-weight:800;margin-top:3px}.slogan{font-size:6px;color:var(--gold);opacity:.8;font-style:italic}
.search{flex:1;background:rgba(0,0,0,.35);border:1px solid var(--border);border-radius:20px;padding:6px 12px;display:flex;align-items:center;gap:6px}
.search input{border:none;background:transparent;outline:none;color:#fff;font-size:12px;width:100%}
.live-count{background:var(--gold);color:#000;border-radius:12px;padding:3px 8px;font-size:10px;font-weight:900;min-width:22px;text-align:center}
.date-tabs{background:#0e0e0e;display:flex;overflow:auto;padding:0 4px;border-bottom:1px solid var(--border);position:sticky;top:61px;z-index:90}
.dt{padding:10px 12px;font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap;border-bottom:2.5px solid transparent;cursor:pointer}
.dt.on{color:var(--text);border-bottom-color:var(--gold);background:rgba(232,184,75,.07)}
#main{padding:6px;padding-bottom:88px;min-height:80vh}
.league-card{background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:8px;overflow:hidden;content-visibility:auto;contain-intrinsic-size:200px}
.league-head{background:var(--card2);padding:9px 11px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.league-head b{font-size:12px;font-weight:800;display:flex;align-items:center;gap:6px}
.prio{font-size:7px;background:var(--gold);color:#000;padding:2px 5px;border-radius:4px;font-weight:900}
.match-row{display:flex;align-items:center;justify-content:space-between;padding:10px 10px;border-bottom:1px solid #151515;cursor:pointer}
.team{flex:1;display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600}
.team-left{justify-content:flex-end;text-align:right}.team-right{justify-content:flex-start}
.team-logo{width:22px;height:22px;background:#0a0a0a;border-radius:50%;overflow:hidden;display:grid;place-items:center;flex-shrink:0;border:1px solid #1a1a1a}
.team-logo img{width:100%;height:100%;object-fit:contain}
.center{width:68px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px}
.score{color:var(--gold);background:#000;border:1px solid var(--border);border-radius:7px;padding:3px 7px;font-size:12px;font-weight:900;min-width:52px}
.time{color:#fff;font-size:11px;font-weight:700}
.status{font-size:8px;color:var(--muted);text-transform:uppercase}.status.live{color:var(--gold);font-weight:800}
.scorers{font-size:8.5px;color:#bbb;margin-top:3px;max-width:160px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.following-card{background:linear-gradient(135deg,var(--green),var(--green2));border:1px solid var(--gold);border-radius:12px;margin-bottom:10px;overflow:hidden;content-visibility:auto;contain-intrinsic-size:200px}
.following-head{padding:9px 11px;display:flex;justify-content:space-between;background:rgba(0,0,0,.25);border-bottom:1px solid rgba(232,184,75,.2)}
.following-head b{color:var(--gold);font-size:12px}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#0c0c0c;border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:5px 0 6px;z-index:100}
.nav{flex:1;text-align:center;font-size:8.5px;color:var(--muted);font-weight:700;cursor:pointer;padding:3px}
.nav.on{color:var(--gold)}.nav span{font-size:17px;display:block;margin-bottom:1px}
.empty{text-align:center;padding:40px 12px;color:var(--muted);font-size:12px;line-height:1.6}.empty b{color:var(--gold)}
#detail{position:fixed;inset:0;background:var(--dark);z-index:200;display:none;flex-direction:column}
#detail.show{display:flex}
.d-head{background:linear-gradient(135deg,var(--green),var(--green2));padding:10px 12px;display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid var(--gold)}
.close{width:30px;height:30px;border-radius:50%;border:1px solid var(--gold);background:rgba(0,0,0,.3);color:var(--gold);font-size:18px;cursor:pointer;display:grid;place-items:center}
.scoreboard{background:var(--card);padding:14px 10px;text-align:center;border-bottom:1px solid var(--border)}
.teams{display:flex;justify-content:space-around;align-items:center;gap:6px}
.tbox{flex:1;text-align:center}.tbox img{width:44px;height:44px;object-fit:contain;background:#0a0a0a;border-radius:50%;padding:4px;border:1px solid #1a1a1a}
.tbox div{font-size:12px;font-weight:800;margin-top:5px}
.sbox{font-size:26px;font-weight:900;color:var(--gold);background:#000;border:1px solid var(--border);border-radius:10px;padding:5px 12px;min-width:72px}
.mstatus{font-size:9px;color:var(--muted);margin-top:6px}
.tabs{display:flex;gap:4px;padding:7px;background:#0a0a0a;border-bottom:1px solid var(--border);overflow:auto}
.tb{flex:1;min-width:60px;padding:7px 6px;border-radius:8px;background:#1a1a1a;color:#777;font-size:9.5px;font-weight:800;text-align:center;cursor:pointer;border:1px solid #222;white-space:nowrap}
.tb.on{background:var(--gold);color:#000;border-color:var(--gold)}
.content{flex:1;overflow:auto;padding:10px;font-size:11.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.team-panel{background:#111;border:1px solid var(--border);border-radius:10px;padding:8px}
.team-panel b{color:var(--gold);font-size:10px;display:block;margin-bottom:5px}
.player{font-size:11px;padding:4px 0;border-bottom:1px solid #181818;display:flex;justify-content:space-between;gap:4px}
.stat-row{padding:7px 0;border-bottom:1px solid #151515}
.stat-head{display:flex;justify-content:space-between;font-size:11px;font-weight:800}
.bar{height:5px;background:#1a1a1a;border-radius:3px;display:flex;margin-top:4px;overflow:hidden}
.fill{height:100%;background:var(--gold)}.fill.opp{background:#333}
.event{padding:8px 0;border-bottom:1px solid #151515;display:flex;gap:8px;font-size:11px}
.e-time{font-weight:900;color:var(--gold);min-width:34px}
.btn{padding:6px 12px;border-radius:20px;border:1px solid var(--border);background:var(--card2);color:#fff;font-size:10px;font-weight:700;cursor:pointer}
.btnGold{background:var(--gold);color:#000;border-color:var(--gold)}
.news-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px;margin-bottom:8px;display:flex;gap:10px}
a.news-card{color:inherit;text-decoration:none}
.news-card img{width:60px;height:60px;border-radius:8px;object-fit:cover;background:#0a0a0a}
.news-title{font-size:12px;font-weight:700;line-height:1.3}.news-meta{font-size:9px;color:var(--muted);margin-top:4px}
.standings-table{width:100%;border-collapse:collapse;font-size:11px}
.standings-table th{color:var(--muted);font-size:9px;text-align:left;padding:6px 4px;border-bottom:1px solid var(--border)}
.standings-table td{padding:6px 4px;border-bottom:1px solid #151515}

/* === TACTICAL PITCH FEATURE === */
.pitch-container{position:relative;background:linear-gradient(180deg,#0f5d2f 0%,#0a4a24 50%,#0f5d2f 100%);border:2px solid var(--border);border-radius:12px;padding:8px 4px 12px;overflow:hidden;min-height:380px;margin-bottom:10px}
.pitch-container::before{content:'';position:absolute;top:50%;left:4px;right:4px;height:2px;background:rgba(255,255,255,0.3);transform:translateY(-50%)}
.pitch-container::after{content:'';position:absolute;top:50%;left:50%;width:60px;height:60px;border:2px solid rgba(255,255,255,0.25);border-radius:50%;transform:translate(-50%,-50%)}
.pitch-line{position:absolute;left:10%;right:10%;height:2px;background:rgba(255,255,255,0.2)}
.pitch-line.top{top:18%}.pitch-line.bottom{bottom:18%}
.pitch-area{position:absolute;left:25%;right:25%;height:14%;border:2px solid rgba(255,255,255,0.2)}
.pitch-area.top{top:0;border-top:none}.pitch-area.bottom{bottom:0;border-bottom:none}
.pitch-goal{position:absolute;left:35%;right:35%;height:6%;border:2px solid rgba(255,255,255,0.15)}
.pitch-goal.top{top:0;border-top:none}.pitch-goal.bottom{bottom:0;border-bottom:none}
.formation-row{display:flex;justify-content:space-around;align-items:center;gap:2px;padding:4px 0;position:relative;z-index:2}
.formation-label{position:absolute;left:2px;top:50%;transform:translateY(-50%);font-size:7px;color:rgba(255,255,255,0.35);font-weight:800;writing-mode:vertical-rl}
.player-badge{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:48px;max-width:64px}
.badge-circle{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--gold),#c99a2b);color:#000;display:grid;place-items:center;font-weight:900;font-size:12px;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,0.5)}
.badge-circle.gk{background:linear-gradient(135deg,#ff9a00,#ff6a00);color:#fff}
.badge-name{font-size:8px;color:#fff;font-weight:700;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60px;text-shadow:0 1px 2px rgba(0,0,0,0.8)}
.badge-pos{font-size:6px;color:var(--gold);font-weight:800}
.team-pitch-header{display:flex;justify-content:space-between;align-items:center;padding:6px 8px;background:rgba(0,0,0,0.4);border-radius:8px;margin-bottom:6px;border:1px solid rgba(232,184,75,0.2)}
.team-pitch-header b{color:var(--gold);font-size:11px}
.team-pitch-header span{font-size:9px;color:#888}

</style>
</head>
<body>
<header>
<div class="logo"><span class="je">je</span><span class="scores">Scores</span><small>BY JESSENDINHO</small><div class="slogan">Every Goal. Every Update.</div></div>
<div class="search"><span aria-hidden="true">🔍</span> <input id="q" type="search" aria-label="Search team or league" placeholder="Search team, league..." oninput="onSearch()"></div>
<div class="hdr-actions"><div class="live-count" id="liveCount" aria-live="polite">0 LIVE</div><div role="button" tabindex="0" aria-label="Pick a date" data-act="pickdate" style="width:30px;height:30px;background:rgba(0,0,0,.3);border:1px solid var(--border);border-radius:50%;display:grid;place-items:center;color:var(--gold);font-size:12px;cursor:pointer">📅</div></div>
</header>
<div class="date-tabs" id="dateTabs"></div>
<div id="main"></div>
<nav class="bottom" aria-label="Main navigation">
<div class="nav on" id="nav-matches" role="button" tabindex="0" data-act="page" data-page="matches"><span>⚽</span>Matches</div>
<div class="nav" id="nav-news" role="button" tabindex="0" data-act="page" data-page="news"><span>📰</span>News</div>
<div class="nav" id="nav-leagues" role="button" tabindex="0" data-act="page" data-page="leagues"><span>🏆</span>Leagues</div>
<div class="nav" id="nav-following" role="button" tabindex="0" data-act="page" data-page="following"><span>⭐</span>Following</div>
<div class="nav" id="nav-more" role="button" tabindex="0" data-act="page" data-page="more"><span>☰</span>More</div>
</nav>
<div id="detail" role="dialog" aria-modal="true" aria-labelledby="dTitle">
<div class="d-head"><b id="dTitle">jeScores • Match</b><button class="close" type="button" aria-label="Close match" data-act="closedetail">×</button></div>
<div class="scoreboard" id="scoreboard"></div>
<div class="tabs" role="tablist">
<div class="tb on" id="tb-overview" role="tab" tabindex="0" data-act="tab" data-tab="overview">Overview</div>
<div class="tb" id="tb-lineup" role="tab" tabindex="0" data-act="tab" data-tab="lineup">Lineup</div>
<div class="tb" id="tb-stats" role="tab" tabindex="0" data-act="tab" data-tab="stats">Stats</div>
<div class="tb" id="tb-events" role="tab" tabindex="0" data-act="tab" data-tab="events">Events</div>
<div class="tb" id="tb-h2h" role="tab" tabindex="0" data-act="tab" data-tab="h2h">H2H</div>
</div>
<div class="content" id="dContent"></div>
</div>
<input type="date" id="datePicker" aria-label="Match date" tabindex="-1" style="position:absolute;opacity:0;pointer-events:none">
<script>
var W="https://old-poetry-cb6d.jessegitonga04.workers.dev";
var TOP5={39:1,140:2,135:3,78:4,61:5};
var UEFA={2:6,3:7,848:8};
var LIVE_STATUS=['1H','2H','HT','ET','BT','P','LIVE'];
var DONE_STATUS=['FT','AET','PEN','AWD','WO'];
var KEY_PREFIX='jeScores_';
var FAV_LEGACY='jeScores_fav';        /* legacy + mirror: array of team names */
var FAV_V2='jeScores_fav_v2';         /* array of {id,name} */
var FIX_PREFIX='jeScores_fixtures_l_'; /* local-calendar-date fixtures cache */
var TZ='';
try{TZ=Intl.DateTimeFormat().resolvedOptions().timeZone||'';}catch(e){}
var games=[],extraGames={},curDate=new Date(),curPage='matches',collapsed={},curMatch=null,curTab='overview',pending={},pageSeq=0;
var memCache={},memTime={};

/* ---------- helpers ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function nid(x){var n=parseInt(x,10);return isNaN(n)?0:n;}
function safeUrl(u,allowHttp){
  if(!u) return '';
  try{
    var x=new URL(String(u),location.href);
    if(x.protocol==='https:') return x.href;
    if(x.protocol==='http:'){ if(allowHttp) return x.href; x.protocol='https:'; return x.href; }
  }catch(e){}
  return '';
}
function teamLogo(id){return 'https://media.api-sports.io/football/teams/'+nid(id)+'.png';}
function leagueLogo(id){return 'https://media.api-sports.io/football/leagues/'+nid(id)+'.png';}
function localDateStr(d){var m=d.getMonth()+1,day=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(day<10?'0':'')+day;}
function parseLocalDate(s){var p=String(s||'').split('-');if(p.length!==3) return null;var d=new Date(+p[0],+p[1]-1,+p[2]);return isNaN(d.getTime())?null:d;}
function isTodayStr(s){return s===localDateStr(new Date());}

/* ---------- cache (jeScores-owned keys only) ---------- */
function getCache(k){
  if (k in memCache) return memCache[k];
  try { var v = localStorage.getItem(k); if (!v) return null; var p = JSON.parse(v); memCache[k] = p.d; memTime[k] = p.t; return p.d; } catch(e){ return null; }
}
function setCache(k, d){
  memCache[k] = d; memTime[k] = Date.now();
  var payload = JSON.stringify({t: Date.now(), d: d});
  try { localStorage.setItem(k, payload); }
  catch(e){
    pruneCache(true);
    try { localStorage.setItem(k, payload); } catch(e2){}
  }
}
function cacheAge(k){
  if (k in memTime) return Date.now() - memTime[k];
  try { var v = localStorage.getItem(k); if (!v) return 999999999; var p = JSON.parse(v); memCache[k] = p.d; memTime[k] = p.t; return Date.now() - p.t; } catch(e){ return 999999999; }
}
function isProtectedKey(k){return k===FAV_LEGACY||k===FAV_V2;}
function ownedKeys(){
  var keys=[];
  try{ for (var i = 0; i < localStorage.length; i++){ var k = localStorage.key(i); if (k && k.indexOf(KEY_PREFIX) === 0 && !isProtectedKey(k)) keys.push(k); } }catch(e){}
  return keys;
}
function pruneCache(force){
  var now = Date.now();
  ownedKeys().forEach(function(k){
    var ttl;
    if (k.indexOf('jeScores_fixtures_') === 0) ttl = 172800000;
    else if (k.indexOf('jeScores_events_') === 0) ttl = 86400000;
    else ttl = 604800000;
    if (force && k.indexOf('jeScores_events_') !== 0 && k.indexOf('jeScores_fixtures_') !== 0) ttl = 3600000;
    try { var v = JSON.parse(localStorage.getItem(k)); if (v && v.t && (now - v.t) > ttl){ localStorage.removeItem(k); delete memCache[k]; delete memTime[k]; } } catch(e){ try{localStorage.removeItem(k);}catch(e2){} }
  });
}
function clearJeScoresCache(){
  ownedKeys().forEach(function(k){ try{localStorage.removeItem(k);}catch(e){} });
  memCache={};memTime={};
}

/* ---------- following (stable team ids, legacy names kept in sync) ---------- */
function readJson(k){try{var v=JSON.parse(localStorage.getItem(k)||'[]');return Array.isArray(v)?v:[];}catch(e){return [];}}
function getFavIds(){return readJson(FAV_V2).filter(function(x){return x&&x.id;});}
function getFavNames(){return readJson(FAV_LEGACY).filter(function(x){return typeof x==='string';});}
function saveFav(ids,names){
  try{localStorage.setItem(FAV_V2,JSON.stringify(ids));localStorage.setItem(FAV_LEGACY,JSON.stringify(names));}catch(e){}
}
function isFollowed(team){
  if(!team) return false;
  var ids=getFavIds();
  for(var i=0;i<ids.length;i++){ if(ids[i].id==team.id) return true; }
  return getFavNames().indexOf(team.name)>-1;
}
/* Attach stable ids to followed names saved by older versions */
function migrateFav(list){
  var names=getFavNames();
  if(!names.length) return;
  var ids=getFavIds(),changed=false,seen={};
  (list||[]).forEach(function(g){
    [g.teams.home,g.teams.away].forEach(function(t){
      if(t && names.indexOf(t.name)>-1){ seen[t.name]=seen[t.name]||{}; seen[t.name][t.id]=1; }
    });
  });
  Object.keys(seen).forEach(function(n){
    var tids=Object.keys(seen[n]);
    if(tids.length===1 && !ids.some(function(x){return x.id==tids[0];})){ ids.push({id:nid(tids[0]),name:n}); changed=true; } /* only when the name maps to one team */
  });
  if(changed) saveFav(ids,names);
}
function followTeam(id,name){
  var ids=getFavIds(),names=getFavNames();
  var followed=ids.some(function(x){return id && x.id==id;})||names.indexOf(name)>-1;
  if(!followed){
    if(id) ids.push({id:id,name:name});
    if(names.indexOf(name)==-1) names.push(name);
    saveFav(ids,names);
    alert('⭐ Following '+name);
  } else {
    ids=ids.filter(function(x){return !(id && x.id==id) && x.name!==name;});
    names=names.filter(function(n){return n!==name;});
    saveFav(ids,names);
    alert('Unfollowed '+name);
  }
  if(curPage=='matches') renderMatches(true);
  else if(curPage=='following') loadFollowingPage();
}
function followList(){
  var ids=getFavIds(),names=getFavNames(),out=ids.map(function(x){return {id:x.id,name:x.name};});
  names.forEach(function(n){ if(!ids.some(function(x){return x.name===n;})) out.push({id:0,name:n}); });
  return out;
}

/* ---------- networking ---------- */
var renderTimer;
function queueRender(){
  clearTimeout(renderTimer);
  renderTimer = setTimeout(function(){ if (curPage == 'matches') renderMatches(false); }, 250);
}
function fetchDedup(url){if(pending[url]) return pending[url];var p=fetch(url).then(function(r){if(!r.ok) throw new Error('HTTP '+r.status);return r.json();}).finally(function(){delete pending[url];});pending[url]=p;return p;}
function respArr(d){return (d&&Array.isArray(d.response))?d.response:[];}
function indexGames(list){(list||[]).forEach(function(g){ if(g&&g.fixture) extraGames[g.fixture.id]=g; });}
function findGame(id){
  for(var i=0;i<games.length;i++){ if(games[i].fixture.id==id) return games[i]; }
  return extraGames[id]||null;
}

/* ---------- date tabs ---------- */
function buildDateTabs(){
  var el=document.getElementById('dateTabs');var html='';var cur=localDateStr(curDate);
  for(var i=-3;i<=7;i++){
    var d=new Date();d.setDate(d.getDate()+i);var label='';
    if(i==-1) label='Yesterday';else if(i==0) label='Today';else if(i==1) label='Tomorrow';
    else label=d.toLocaleDateString('en-GB',{weekday:'short'})+' '+d.getDate()+' '+d.toLocaleDateString('en-GB',{month:'short'});
    var on=localDateStr(d)===cur;
    html+='<div class="dt'+(on?' on':'')+'" role="button" tabindex="0" data-act="date" data-off="'+i+'"'+(on?' aria-current="date"':'')+'>'+esc(label)+'</div>';
  }
  el.innerHTML=html;
}
function setDateOffset(o){var d=new Date();d.setDate(d.getDate()+o);curDate=d;document.getElementById('datePicker').value=localDateStr(d);buildDateTabs();loadMatches(false);}
function pickDate(){var dp=document.getElementById('datePicker');try{dp.showPicker();}catch(e){try{dp.focus();dp.click();}catch(e2){}}}
document.getElementById('datePicker').addEventListener('change',function(){var d=parseLocalDate(this.value);curDate=d||new Date();buildDateTabs();loadMatches(false);});

/* ---------- matches ---------- */
function loadMatches(forceFresh){
  var dateStr=localDateStr(curDate);var cacheKey=FIX_PREFIX+dateStr;var cached=getCache(cacheKey);
  if(cached && !forceFresh){
    games=cached;indexGames(cached);renderMatches(true);syncOpenMatch();
    if(cacheAge(cacheKey)>60000 || isTodayStr(dateStr)){fetchFresh(dateStr,cacheKey);}
    return;
  }
  if(curPage=='matches') document.getElementById('main').innerHTML='<div class="empty"><b>jeScores</b><br>Loading matches...<br>Every Goal. Every Update.</div>';
  fetchFresh(dateStr,cacheKey);
}
function fetchFresh(dateStr,cacheKey){
  var url=W+"/v3/fixtures?date="+encodeURIComponent(dateStr)+(TZ?"&timezone="+encodeURIComponent(TZ):"");
  fetchDedup(url).then(function(data){
    var fix=respArr(data);
    setCache(cacheKey,fix);
    if(localDateStr(curDate)!==dateStr) return; /* user moved to another date: do not overwrite */
    games=fix;indexGames(fix);migrateFav(fix);
    renderMatches(false);
    syncOpenMatch();
    fetchGoalScorers(fix);
  }).catch(function(e){
    if(localDateStr(curDate)!==dateStr) return;
    var cached=getCache(cacheKey);
    if(cached){games=cached;indexGames(cached);renderMatches(true);syncOpenMatch();}
    else if(curPage=='matches') document.getElementById('main').innerHTML='<div class="empty"><b>Error</b><br>'+esc(e.message)+'<br><button class="btn btnGold" type="button" data-act="retrymatches">Retry</button></div>';
  });
}
/* Fetch events for every live match first, then important finished matches */
function fetchGoalScorers(fix){
  var live=fix.filter(function(g){return LIVE_STATUS.indexOf(g.fixture.status.short)>-1;});
  var priorityFinished=fix.filter(function(g){
    var finished=DONE_STATUS.indexOf(g.fixture.status.short)>-1;
    return finished && (TOP5[g.league.id] || UEFA[g.league.id]);
  });
  var targets=live.concat(priorityFinished);
  targets.forEach(function(g){
    var isLive=LIVE_STATUS.indexOf(g.fixture.status.short)>-1;
    var k='jeScores_events_'+g.fixture.id;
    var ttl=isLive?45000:86400000;
    if(cacheAge(k)<ttl) return;
    fetchDedup(W+'/v3/fixtures/events?fixture='+encodeURIComponent(g.fixture.id)).then(function(d){
      setCache(k,respArr(d));
      queueRender();
      if(stillOn(g.fixture.id)){
        if(curTab=='events'){
          var cont=document.getElementById('dContent');
          if(cont) renderEvents(getCache(k)||[],cont);
        } else if(curTab=='overview'){
          setTab('overview');
        }
      }
    }).catch(function(){});
  });
}
function renderMatches(fromCache){
  if(curPage!='matches') return;
  var q=document.getElementById('q').value.toLowerCase();var list=games;
  if(q) list=list.filter(function(g){return (g.teams.home.name+g.teams.away.name+g.league.name+g.league.country).toLowerCase().indexOf(q)>-1;});
  var liveCount=list.filter(function(g){return LIVE_STATUS.indexOf(g.fixture.status.short)>-1;}).length;
  var lc=document.getElementById('liveCount');
  lc.textContent=liveCount>0?liveCount+' LIVE':'0 LIVE';
  lc.style.background=liveCount>0?'var(--gold)':'#222';
  lc.style.color=liveCount>0?'#000':'#666';
  var groups={};
  list.forEach(function(g){var id=g.league.id;if(!groups[id]) groups[id]={league:g.league,games:[],prio:TOP5[id]||UEFA[id]||99};groups[id].games.push(g);});
  var sorted=Object.keys(groups).map(function(k){return groups[k];}).sort(function(a,b){if(a.prio!=b.prio) return a.prio-b.prio;return String(a.league.name).localeCompare(String(b.league.name));});
  var followingGames=list.filter(function(g){return isFollowed(g.teams.home)||isFollowed(g.teams.away);});
  var html='';
  if(fromCache) html+='<div style="text-align:center;font-size:8px;color:#555;padding:3px">Cached • Updating • Every Goal. Every Update.</div>';
  if(followingGames.length>0 && !q){
    html+='<div class="following-card"><div class="following-head"><b>⭐ Following ('+followingGames.length+')</b></div>';
    followingGames.forEach(function(g){html+=matchRow(g);});
    html+='</div>';
  }
  sorted.forEach(function(group){
    var isCollapsed=collapsed[group.league.id];
    var prioLabel=group.prio<=5?'<span class="prio">TOP 5</span>':'';
    html+='<div class="league-card"><div class="league-head" role="button" tabindex="0" aria-expanded="'+(isCollapsed?'false':'true')+'" data-act="toggle" data-id="'+nid(group.league.id)+'"><b>🏳️ '+esc(group.league.country)+' - '+esc(group.league.name)+' <span>('+group.games.length+')</span> '+prioLabel+'</b><span aria-hidden="true">⌃</span></div>';
    if(!isCollapsed){
      group.games.sort(function(a,b){
        var liveA=['1H','2H','HT','LIVE'].indexOf(a.fixture.status.short)>-1;
        var liveB=['1H','2H','HT','LIVE'].indexOf(b.fixture.status.short)>-1;
        if(liveA!=liveB) return liveB-liveA;
        return new Date(a.fixture.date)-new Date(b.fixture.date);
      }).forEach(function(g){html+=matchRow(g);});
    }
    html+='</div>';
  });
  if(!html || (sorted.length==0 && followingGames.length==0)) html='<div class="empty"><b>No matches</b><br>'+esc(curDate.toDateString())+'<br><br>Try another date</div>';
  document.getElementById('main').innerHTML=html;
}
function matchRow(g){
  var s=g.fixture.status.short;
  var live=['1H','2H','ET','BT','P','LIVE'].indexOf(s)>-1;
  var ht=s=='HT',ns=s=='NS',pen=s=='PEN';
  var timeStr=new Date(g.fixture.date).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
  var scoreText=ns?timeStr:(g.goals.home!=null?g.goals.home:'-')+' - '+(g.goals.away!=null?g.goals.away:'-');
  if(pen) scoreText+=' (PEN)';
  var statusText=ns?timeStr:live?(g.fixture.status.elapsed?g.fixture.status.elapsed+"'":'LIVE'):ht?'HT':s;
  var events=getCache('jeScores_events_'+g.fixture.id);
  var scorerLine='';
  if(events){
    var goals=events.filter(function(ev){return ev.type=='Goal';});
    if(goals.length>0){
      scorerLine=goals.slice(0,2).map(function(ev){
        var nm=String((ev.player&&ev.player.name)||'').split(' ').pop();
        return '<b>'+esc(nm)+'</b> '+esc(ev.time&&ev.time.elapsed)+"'";
      }).join(', ');
      if(goals.length>2) scorerLine+=' +'+(goals.length-2);
    }
  }
  return '<div class="match-row" role="button" tabindex="0" data-act="match" data-id="'+nid(g.fixture.id)+'">'+
    '<div class="team team-left"><span>'+esc(g.teams.home.name)+'</span><div class="team-logo"><img src="'+teamLogo(g.teams.home.id)+'" alt="" loading="lazy"></div></div>'+
    '<div class="center"><div class="'+(ns?'time':'score')+'">'+esc(scoreText)+'</div><div class="status '+(live?'live':'')+'">'+esc(statusText)+'</div>'+(scorerLine?'<div class="scorers">⚽ '+scorerLine+'</div>':'')+'</div>'+
    '<div class="team team-right"><div class="team-logo"><img src="'+teamLogo(g.teams.away.id)+'" alt="" loading="lazy"></div><span>'+esc(g.teams.away.name)+'</span></div></div>';
}

function scoreOf(m){var s=(m.goals.home!=null?m.goals.home:'-')+' - '+(m.goals.away!=null?m.goals.away:'-');if(m.fixture.status.short=='NS') s='vs';return s;}
function statusLine(m){return esc(m.fixture.status.long)+(m.fixture.status.elapsed?' • '+esc(m.fixture.status.elapsed)+"'":'');}
function metaLine(m){return esc(m.league.name)+' • '+esc(m.league.country)+' • '+esc((m.fixture.venue&&m.fixture.venue.name)||'')+' • '+esc(new Date(m.fixture.date).toLocaleString())+' • Ref: '+esc(m.fixture.referee||'TBA');}

  } else if(t=='events'){
    k='jeScores_events_'+mid;

function fetchLineup(k,c,mid){fetchDedup(W+"/v3/fixtures/lineups?fixture="+encodeURIComponent(mid)).then(function(d){setCache(k,respArr(d));if(stillOn(mid,'lineup')) renderLineup(respArr(d),c);}).catch(function(e){if(stillOn(mid,'lineup') && !getCache(k)) c.innerHTML='<div class="empty">Lineup not available<br>'+esc(e.message)+'</div>';});}
function lineupList(l){
  var h='<div class="team-panel"><b>'+esc(l.team.name)+' '+esc(l.formation||'')+'</b><div style="font-size:9px;color:#888">Coach: '+esc((l.coach&&l.coach.name)||'TBA')+'</div>';
  (l.startXI||[]).forEach(function(p){h+='<div class="player"><span>'+esc(p.player.number||'')+' '+esc(p.player.name)+'</span><span style="color:#888">'+esc(p.player.pos||'')+'</span></div>';});
  h+='<div style="margin-top:6px;font-size:9px;color:#666">Bench: '+(l.substitutes||[]).map(function(p){return esc(p.player.name);}).join(', ')+'</div></div>';
  return h;
}
function renderLineup(lineups,c){
  if(lineups.length==0){
    c.innerHTML='<div style="background:#0a2e1c;border:1px solid #e8b84b;border-radius:10px;padding:12px"><b style="color:#e8b84b">Lineups not announced yet</b><br><br>'+esc(curMatch.teams.home.name)+' vs '+esc(curMatch.teams.away.name)+'<br>Status: '+esc(curMatch.fixture.status.long)+'<br><br>Predicted XI appears 2 days before kickoff when provider supports it.<br>Official XI 1h before kickoff.<br><br><span style="font-size:10px;color:#888">Real data only - no fake players</span></div>';
    return;
  }
  var html='<div style="display:flex;flex-direction:column;gap:12px">';
  lineups.forEach(function(l){
    var formation=String(l.formation||'');
    var parts=formation.split('-').map(function(n){return parseInt(n,10)||0;});
    var sum=parts.reduce(function(a,b){return a+b;},0);
    var players=l.startXI||[];
    if(players.length<11 || sum!==10 || parts.some(function(n){return n<=0;})){
      html+=lineupList(l);
      return;
    }
    var gk=players[0];
    var outfield=players.slice(1);
    var idx=0,rowsDefToAtt=[];
    parts.forEach(function(count){rowsDefToAtt.push(outfield.slice(idx,idx+count));idx+=count;});
    var rows=rowsDefToAtt.reverse(); /* attack at the top, then midfield, then defence */
    rows.push([gk]);
    html+='<div class="league-card" style="padding:8px"><div class="team-pitch-header"><b>⚽ '+esc(l.team.name)+' <span style="color:#fff;font-weight:400">'+esc(formation)+'</span></b><span>Coach: '+esc((l.coach&&l.coach.name)||'TBA')+'</span></div>';
    html+='<div class="pitch-container">';
    html+='<div class="pitch-area top"></div><div class="pitch-goal top"></div>';
    html+='<div class="pitch-line top"></div><div class="pitch-line bottom"></div>';
    html+='<div class="pitch-area bottom"></div><div class="pitch-goal bottom"></div>';
    rows.forEach(function(row,rIdx){
      var isGK=rIdx===rows.length-1;
      html+='<div class="formation-row">';
      if(!isGK){
        var label=rIdx===0?'ATT':(rIdx===rows.length-2?'DEF':'MID');
        html+='<div class="formation-label">'+label+'</div>';
      }
      row.forEach(function(p){
        var name=String(p.player.name||'');
        var shortName=name.split(' ').pop()||name;
        if(shortName.length>10) shortName=shortName.substring(0,9);
        html+='<div class="player-badge"><div class="'+(isGK?'badge-circle gk':'badge-circle')+'">'+esc(p.player.number||'')+'</div><div class="badge-name">'+esc(shortName)+'</div><div class="badge-pos">'+esc(p.player.pos||'')+'</div></div>';
      });
      html+='</div>';
    });
    html+='</div>';
    html+='<div style="margin-top:8px"><div style="font-size:9px;color:var(--gold);font-weight:800;margin-bottom:4px">Bench:</div><div style="display:flex;flex-wrap:wrap;gap:4px">';
    (l.substitutes||[]).forEach(function(p){
      html+='<span style="background:#1a1a1a;border:1px solid var(--border);border-radius:10px;padding:2px 6px;font-size:9px">'+esc(p.player.number||'')+' '+esc(p.player.name)+'</span>';
    });
    html+='</div></div></div>';
  });
  html+='</div>';
  c.innerHTML=html;
}
function fetchStats(k,c,mid){fetchDedup(W+"/v3/fixtures/statistics?fixture="+encodeURIComponent(mid)).then(function(d){setCache(k,respArr(d));if(stillOn(mid,'stats')) renderStats(respArr(d),c);}).catch(function(e){if(stillOn(mid,'stats') && !getCache(k)) c.innerHTML='<div class="empty">Stats not available<br>'+esc(curMatch.fixture.status.long)+'</div>';});}
function renderStats(stats,c){
  if(stats.length==0){c.innerHTML='<div class="empty">No stats yet - '+esc(curMatch.fixture.status.long)+'</div>';return;}
  var html='<div style="background:#111;border:1px solid var(--border);border-radius:10px;padding:10px">';
  var seen={},types=[];
  stats.forEach(function(s){(s.statistics||[]).forEach(function(st){if(!seen[st.type]){seen[st.type]=1;types.push(st.type);}});});
  function val(team,type){var f=team&&(team.statistics||[]).filter(function(s){return s.type==type;})[0];return f?f.value:null;}
  types.forEach(function(type){
    var hv=val(stats[0],type),av=val(stats[1],type);
    if(hv==null && av==null) return;
    if(hv==null) hv='0'; if(av==null) av='0';
    var hN=parseFloat(hv)||0,aN=parseFloat(av)||0,total=hN+aN||1,pct=(hN/total)*100;
    html+='<div class="stat-row"><div class="stat-head"><span style="color:'+(hN>=aN?'var(--gold)':'#777')+'">'+esc(hv)+'</span><span style="color:#666;font-size:10px">'+esc(type)+'</span><span style="color:'+(aN>=hN?'var(--gold)':'#777')+'">'+esc(av)+'</span></div><div class="bar"><div class="fill" style="width:'+pct+'%"></div><div class="fill opp" style="width:'+(100-pct)+'%"></div></div></div>';
  });
  html+='</div>';
  c.innerHTML=html;
}
function fetchEvents(k,c,mid){fetchDedup(W+"/v3/fixtures/events?fixture="+encodeURIComponent(mid)).then(function(d){setCache(k,respArr(d));if(stillOn(mid,'events')) renderEvents(respArr(d),c);}).catch(function(e){if(stillOn(mid,'events') && !getCache(k)) c.innerHTML='<div class="empty">Events not available<br>'+esc(e.message)+'</div>';});}
function renderEvents(events,c){
  if(events.length==0){c.innerHTML='<div class="empty">No events yet - '+esc(curMatch.fixture.status.long)+'</div>';return;}
  var html='<div style="background:#111;border:1px solid var(--border);border-radius:10px;padding:8px">';
  events.forEach(function(ev){
    var icon=ev.type=='Goal'?'⚽':ev.type=='Card'?(ev.detail=='Yellow Card'?'🟨':'🟥'):ev.type=='subst'?'🔄':'•';
    var extra=ev.time&&ev.time.extra?' +'+ev.time.extra:'';
    html+='<div class="event"><div class="e-time">'+esc((ev.time&&ev.time.elapsed)||'')+esc(extra)+"'"+'</div><div style="flex:1"><div><span style="margin-right:4px">'+icon+'</span><b>'+esc(ev.team&&ev.team.name)+'</b> - '+esc(ev.player&&ev.player.name)+(ev.assist&&ev.assist.name?' <span style="color:#888">(Assist: '+esc(ev.assist.name)+')</span>':'')+'</div><div style="font-size:10px;color:#888">'+esc(ev.type)+' - '+esc(ev.detail)+'</div></div></div>';
  });
  html+='</div>';
  c.innerHTML=html;
}
function fetchH2H(k,c,mid,hid,aid){fetchDedup(W+"/v3/fixtures/headtohead?h2h="+encodeURIComponent(hid+'-'+aid)+"&last=10").then(function(d){setCache(k,respArr(d));if(stillOn(mid,'h2h')) renderH2H(respArr(d),c);}).catch(function(e){if(stillOn(mid,'h2h') && !getCache(k)) c.innerHTML='<div class="empty">H2H unavailable</div>';});}
function renderH2H(h2h,c){

  c.innerHTML=html;

/* news */
function loadNews(){
  var main=document.getElementById('main');var cached=getCache('jeScores_news');
  if(cached){renderNews(cached,true); if(cacheAge('jeScores_news')>60000) fetchNews();}
  else{main.innerHTML='<div class="empty"><b>jeScores News</b><br>Loading...</div>';fetchNews();}
}
function fetchNews(){
  var seq=pageSeq;
  var url='https://api.rss2json.com/v1/api.json?rss_url=https://feeds.bbci.co.uk/sport/football/rss.xml';
  fetchDedup(url).then(function(d){
    var items=(d.items||[]).slice(0,20);
    setCache('jeScores_news',items);
    if(seq!==pageSeq||curPage!='news') return;
    renderNews(items,false);
  }).catch(function(e){
    if(seq!==pageSeq||curPage!='news') return;
    var cached=getCache('jeScores_news');
    if(cached) renderNews(cached,true);
    else document.getElementById('main').innerHTML='<div class="empty"><b>News unavailable</b><br><button class="btn btnGold" type="button" data-act="retrynews">Retry</button></div>';
  });
}
function renderNews(items,fromCache){
  if(curPage!='news') return;
  var html=(fromCache?'<div style="text-align:center;font-size:8px;color:#555;padding:3px">Cached</div>':'');
  html+='<div style="padding:5px 0"><b style="color:var(--gold)">⚽ Football News</b><div style="font-size:9px;color:#888">From BBC Sport • Attributable</div></div>';
  items.forEach(function(it){
    var link=safeUrl(it.link,true);
    var img=safeUrl(it.enclosure&&it.enclosure.link)||'https://media.api-sports.io/football/leagues/39.png';
    var inner='<img src="'+esc(img)+'" alt="" loading="lazy"><div><div class="news-title">'+esc(it.title)+'</div><div class="news-meta">'+esc(it.pubDate||'')+' • BBC</div></div>';
    html+=link?'<a class="news-card" href="'+esc(link)+'" target="_blank" rel="noopener noreferrer">'+inner+'</a>':'<div class="news-card">'+inner+'</div>';
  });
  document.getElementById('main').innerHTML=html;
}

/* leagues */
var curLeague=null,curLeagueTab='standings',curLeagueSeason=0,leaguesList=[];
function leagueKey(){return curLeague?curLeague.id+'|'+curLeagueSeason+'|'+curLeagueTab:'';}
function leagueLive(lk){return curPage=='leagues' && leagueKey()===lk;}
function loadLeaguesHub(){
  curLeague=null;
  var main=document.getElementById('main'),seq=pageSeq;
  var cached=getCache('jeScores_leagues');
  if(cached){leaguesList=cached;renderLeagues(cached); if(cacheAge('jeScores_leagues')<86400000) return;}
  else main.innerHTML='<div class="empty"><b>🏆 Leagues • jeScores</b><br>Loading competitions...<br><span style="font-size:10px">Every Goal. Every Update.</span></div>';
  fetchDedup(W+"/v3/leagues?current=true").then(function(d){
    var leagues=respArr(d);
    setCache('jeScores_leagues',leagues);
    leaguesList=leagues;
    if(curPage=='leagues' && !curLeague) renderLeagues(leagues);
  }).catch(function(e){
    if(curPage!='leagues'||curLeague) return;
    if(!getCache('jeScores_leagues')) document.getElementById('main').innerHTML='<div class="empty"><b>Error loading leagues</b><br>'+esc(e.message)+'<br><button class="btn btnGold" type="button" data-act="retryleagues">Retry</button></div>';
  });
}
function leagueCard(l,big){
  var prio=TOP5[l.league.id]?'<span class="prio">TOP 5</span>':(l.league.id==2?'<span class="prio" style="background:#1e3d8f;color:#fff">UCL</span>':'');
  var size=big?22:20;
  return '<div class="league-card"><div class="league-head" role="button" tabindex="0" data-act="league" data-id="'+nid(l.league.id)+'"><div style="display:flex;align-items:center;gap:8px"><img src="'+leagueLogo(l.league.id)+'" alt="" style="width:'+size+'px;height:'+size+'px;object-fit:contain"><b'+(big?'':' style="font-size:11px"')+'>🏳️ '+esc((l.country&&l.country.name)||'World')+' - '+esc(l.league.name)+' '+(big?prio:'')+'</b></div><span style="color:'+(big?'var(--gold)':'var(--muted);font-size:10px')+'" aria-hidden="true">→</span></div></div>';
}
function renderLeagues(leagues){
  if(curPage!='leagues'||curLeague) return;
  var sorted=leagues.slice().sort(function(a,b){
    var pa=TOP5[a.league.id]||UEFA[a.league.id]||99;
    var pb=TOP5[b.league.id]||UEFA[b.league.id]||99;
    if(pa!=pb) return pa-pb;
    return String(a.league.name).localeCompare(String(b.league.name));
  });
  var top6=[39,140,135,78,61,2];
  var topLeagues=sorted.filter(function(l){return top6.indexOf(l.league.id)>-1;});
  var otherLeagues=sorted.filter(function(l){return top6.indexOf(l.league.id)==-1;});
  var html='<div style="padding:6px 0"><b style="color:var(--gold)">🏆 Leagues • jeScores</b><div style="font-size:9px;color:#888">Top 5 + UCL prioritized • Real API data • Tap to open</div></div>';
  html+='<div style="padding:4px 0"><b style="color:var(--gold);font-size:11px">★ Top Competitions</b></div>';
  topLeagues.forEach(function(l){html+=leagueCard(l,true);});
  html+='<div style="padding:8px 0 4px"><b style="font-size:11px;color:#aaa">Other Leagues & Cups</b> <span style="font-size:9px;color:#666">('+otherLeagues.length+')</span></div>';
  otherLeagues.slice(0,100).forEach(function(l){html+=leagueCard(l,false);});
  document.getElementById('main').innerHTML=html;
}
function openLeague(id){
  var l=null;
  for(var i=0;i<leaguesList.length;i++){ if(leaguesList[i].league.id==id){l=leaguesList[i];break;} }
  if(!l) return;
  var seasons=l.seasons||[];
  curLeague={id:l.league.id,name:l.league.name,country:(l.country&&l.country.name)||'World',seasons:seasons};
  var defaultSeason=new Date().getFullYear(); if(new Date().getMonth()<7) defaultSeason--;
  if(seasons.length>0){
    var cur=seasons.filter(function(s){return s.current;})[0];
    var sortedSeasons=seasons.slice().sort(function(a,b){return b.year-a.year;});
    defaultSeason=cur?cur.year:sortedSeasons[0].year;
  }
  curLeagueSeason=defaultSeason;
  curLeagueTab='standings';
  renderLeagueScreen();
}
function renderLeagueScreen(){
  if(!curLeague) return;
  var main=document.getElementById('main');
  var seasons=curLeague.seasons||[];
  var seasonOptions='';
  if(seasons.length>0){
    seasons.slice().sort(function(a,b){return b.year-a.year;}).slice(0,8).forEach(function(s){
      seasonOptions+='<option value="'+nid(s.year)+'" '+(s.year==curLeagueSeason?'selected':'')+'>'+nid(s.year)+'/'+(nid(s.year)+1)+'</option>';
    });
  } else {
    var y=new Date().getFullYear(); for(var i=0;i<5;i++){var yr=y-i; seasonOptions+='<option value="'+yr+'" '+(yr==curLeagueSeason?'selected':'')+'>'+yr+'/'+(yr+1)+'</option>';}
  }
  var html='<div class="league-card"><div class="league-head" style="flex-direction:column;align-items:stretch;gap:6px;cursor:default">';
  html+='<div style="display:flex;justify-content:space-between;align-items:center;width:100%"><div style="display:flex;align-items:center;gap:8px"><img src="'+leagueLogo(curLeague.id)+'" alt="" style="width:26px;height:26px"><b>🏆 '+esc(curLeague.name)+' • '+esc(curLeague.country)+'</b></div><span role="button" tabindex="0" data-act="leaguesback" style="color:var(--gold);cursor:pointer;background:#000;border:1px solid var(--border);border-radius:12px;padding:3px 8px;font-size:10px">← Back</span></div>';
  html+='<div style="display:flex;gap:8px;align-items:center"><label for="seasonSel" style="font-size:10px;color:#888">Season:</label><select id="seasonSel" data-change="season" style="background:#000;color:#fff;border:1px solid var(--border);border-radius:6px;padding:4px 6px;font-size:11px">'+seasonOptions+'</select><span style="font-size:8px;color:#555">API: '+nid(curLeagueSeason)+'</span></div>';
  html+='</div></div>';
  html+='<div role="tablist" style="display:flex;gap:4px;padding:6px 0;overflow:auto;position:sticky;top:61px;background:var(--dark);z-index:5">';
  var tabs=[['standings','Standings'],['fixtures','Fixtures'],['results','Results'],['scorers','Top Scorers'],['assists','Assists']];
  tabs.forEach(function(t){
    html+='<div class="tb '+(curLeagueTab==t[0]?'on':'')+'" role="tab" aria-selected="'+(curLeagueTab==t[0])+'" tabindex="0" data-act="ltab" data-tab="'+t[0]+'" style="min-width:70px">'+t[1]+'</div>';
  });
  html+='</div>';
  html+='<div id="leagueContent"><div class="empty">Loading '+esc(curLeagueTab)+'...</div></div>';
  main.innerHTML=html;
  loadLeagueTabData();
}
function changeSeason(y){curLeagueSeason=parseInt(y,10); renderLeagueScreen();}
function switchLeagueTab(tab){curLeagueTab=tab; renderLeagueScreen();}
function loadLeagueTabData(){
  var container=document.getElementById('leagueContent');
  if(!container) return;
  if(curLeagueTab=='standings') loadLeagueStandings(container);
  else if(curLeagueTab=='fixtures') loadLeagueFixtures(container,false);
  else if(curLeagueTab=='results') loadLeagueFixtures(container,true);
  else if(curLeagueTab=='scorers') loadLeagueTopScorers(container,false);
  else if(curLeagueTab=='assists') loadLeagueTopScorers(container,true);
}
function loadLeagueStandings(container){
  var k='jeScores_standings_'+curLeague.id+'_'+curLeagueSeason;
  var cached=getCache(k);
  if(cached){renderLeagueStandings(cached,container,true); if(cacheAge(k)>60000) fetchLeagueStandings(k,container);}
  else {container.innerHTML='<div class="empty">Loading standings...<br><span style="font-size:10px">Real data from API-Football</span></div>'; fetchLeagueStandings(k,container);}
}
function fetchLeagueStandings(k,container){
  var lk=leagueKey(),lid=curLeague.id,season=curLeagueSeason;
  fetchDedup(W+"/v3/standings?league="+encodeURIComponent(lid)+"&season="+encodeURIComponent(season)).then(function(d){
    setCache(k,respArr(d));
    if(!leagueLive(lk)) return;
    renderLeagueStandings(respArr(d),container,false);
  }).catch(function(e){
    if(!leagueLive(lk)) return;
    var c=getCache(k);
    if(c) renderLeagueStandings(c,container,true);
    else container.innerHTML='<div class="empty"><b>No standings available</b><br>This competition may not have a league table (cup format) or data not yet available for '+nid(season)+'<br><br>Error: '+esc(e.message)+'<br><button class="btn btnGold" type="button" data-act="retryleague">Retry</button></div>';
  });
}
function formBadges(form,extra){
  return String(form||'').split('').slice(-5).map(function(f){
    var c=f=='W'?'#2ecc71':f=='D'?'#888':f=='L'?'#ff3b30':'#555';
    return '<span style="background:'+c+';color:#000;border-radius:3px;padding:1px 3px;font-size:8px;margin:1px;display:inline-block;min-width:10px;text-align:center">'+esc(f)+'</span>';
  }).join('');
}
function standingsRow(s,withDesc){
  var desc='';
  if(withDesc && s.description){
    var dl=String(s.description).toLowerCase(),descColor='#555';
    if(dl.indexOf('champions')>-1) descColor='#2ecc71'; else if(dl.indexOf('europa')>-1) descColor='#f39c12'; else if(dl.indexOf('relegation')>-1) descColor='#ff3b30';
    desc='<div style="font-size:7px;color:'+descColor+'">'+esc(s.description)+'</div>';
  }
  var gd=s.goalsDiff>0?'+'+s.goalsDiff:s.goalsDiff;
  return '<tr><td>'+esc(s.rank)+'</td><td><div style="display:flex;align-items:center;gap:5px"><img src="'+teamLogo(s.team.id)+'" alt="" style="width:16px;height:16px;object-fit:contain"><div><span style="font-weight:700">'+esc(s.team.name)+'</span>'+desc+'</div></div></td><td>'+esc(s.all.played)+'</td><td>'+esc(s.all.win)+'</td><td>'+esc(s.all.draw)+'</td><td>'+esc(s.all.lose)+'</td><td>'+esc(s.all.goals['for'])+'</td><td>'+esc(s.all.goals.against)+'</td><td>'+esc(gd)+'</td><td style="font-weight:900;color:var(--gold)">'+esc(s.points)+'</td><td><div style="display:flex;gap:1px">'+formBadges(s.form)+'</div></td></tr>';
}
var STANDINGS_HEAD='<tr><th>#</th><th>Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GF</th><th>GA</th><th>GD</th><th>Pts</th><th>Form</th></tr>';
function renderLeagueStandings(data,container,fromCache){
  var standings=(data||[])[0]&&data[0].league&&data[0].league.standings;
  if(!standings || standings.length==0 || !standings[0] || standings[0].length==0){
    container.innerHTML='<div class="empty"><b>No standings for this season</b><br>'+esc(curLeague.name)+' • '+nid(curLeagueSeason)+'<br><br>This may be a cup competition or season not started yet.<br>Try another season or check Fixtures tab.</div>';
    return;
  }
  var title='<div style="padding:4px 0"><b style="color:var(--gold);font-size:11px">Standings • '+esc(curLeague.name)+' • '+nid(curLeagueSeason)+'/'+(nid(curLeagueSeason)+1)+'</b> <span style="font-size:9px;color:#666">'+(fromCache?'cached':'live')+'</span></div>';
  var html=(fromCache?'<div style="text-align:center;font-size:8px;color:#555;padding:3px">Cached • Updating</div>':'')+title;
  if(standings.length>1){
    standings.forEach(function(group,gi){
      html+='<div class="league-card" style="padding:8px;margin-bottom:10px"><b style="color:var(--gold);font-size:10px">'+esc((group[0]&&group[0].group)||('Group '+String.fromCharCode(65+gi)))+'</b><div style="overflow:auto"><table class="standings-table">'+STANDINGS_HEAD;
      group.forEach(function(s){html+=standingsRow(s,false);});
      html+='</table></div></div>';
    });
    container.innerHTML=html;
    return;
  }
  html+='<div class="league-card" style="padding:0;overflow:hidden"><div style="overflow:auto"><table class="standings-table" style="min-width:500px">'+STANDINGS_HEAD;
  standings[0].forEach(function(s){html+=standingsRow(s,true);});
  html+='</table></div></div><div style="font-size:8px;color:#666;padding:6px">Swipe table horizontally • GF=Goals For GA=Against GD=Difference • Colors: Green=UCL qualification, Orange=Europa, Red=Relegation (when provider supplies description)</div>';
  container.innerHTML=html;
}
/* One cached season list feeds both Fixtures and Results (one API call, not two) */
function loadLeagueFixtures(container,isResults){
  var k='jeScores_league_all_'+curLeague.id+'_'+curLeagueSeason;
  var cached=getCache(k);
  if(cached){renderLeagueFixtures(cached,container,isResults,true); if(cacheAge(k)>120000) fetchLeagueFixtures(k,container,isResults);}
  else {container.innerHTML='<div class="empty">Loading '+(isResults?'results':'fixtures')+'...<br>Real fixtures from API</div>'; fetchLeagueFixtures(k,container,isResults);}
}
function fetchLeagueFixtures(k,container,isResults){
  var lk=leagueKey(),lid=curLeague.id,season=curLeagueSeason;
  fetchDedup(W+"/v3/fixtures?league="+encodeURIComponent(lid)+"&season="+encodeURIComponent(season)).then(function(d){
    setCache(k,respArr(d));
    if(!leagueLive(lk)) return;
    renderLeagueFixtures(respArr(d),container,isResults,false);
  }).catch(function(e){
    if(!leagueLive(lk)) return;
    var c=getCache(k);
    if(c) renderLeagueFixtures(c,container,isResults,true);
    else container.innerHTML='<div class="empty"><b>Error loading fixtures</b><br>'+esc(e.message)+'<br><button class="btn btnGold" type="button" data-act="retryleague">Retry</button></div>';
  });
}
function renderLeagueFixtures(fixtures,container,isResults,fromCache){
  var list=fixtures.slice();
  if(isResults) list=list.filter(function(g){return DONE_STATUS.indexOf(g.fixture.status.short)>-1;});
  else list=list.filter(function(g){return ['NS','TBD','1H','2H','HT','LIVE','ET','BT','P','SUSP','INT'].indexOf(g.fixture.status.short)>-1;});
  list.sort(function(a,b){return isResults? new Date(b.fixture.date)-new Date(a.fixture.date) : new Date(a.fixture.date)-new Date(b.fixture.date);});
  if(list.length==0){
    container.innerHTML='<div class="empty"><b>No '+(isResults?'results':'upcoming fixtures')+' for '+nid(curLeagueSeason)+'</b><br>Try other tab or season</div>';
    return;
  }
  indexGames(list); /* so the match centre can open these without touching today's list */
  var html=(fromCache?'<div style="text-align:center;font-size:8px;color:#555;padding:3px">Cached • Updating</div>':'');
  html+='<div style="padding:4px 0"><b style="color:var(--gold);font-size:11px">'+(isResults?'Results':'Upcoming Fixtures')+' • '+esc(curLeague.name)+' • '+nid(curLeagueSeason)+'</b> <span style="font-size:9px;color:#666">'+list.length+' matches</span></div>';
  var byDate={},order=[];
  list.forEach(function(g){var d=new Date(g.fixture.date).toDateString(); if(!byDate[d]){byDate[d]=[];order.push(d);} byDate[d].push(g);});
  order.forEach(function(dateStr){
    html+='<div class="league-card"><div class="league-head" style="background:#0a0a0a;cursor:default"><b style="font-size:10px;color:#aaa">'+esc(dateStr)+'</b><span style="font-size:9px;color:#666">'+byDate[dateStr].length+' matches</span></div>';
    byDate[dateStr].forEach(function(g){html+=matchRow(g);});
    html+='</div>';
  });
  container.innerHTML=html;
}
function loadLeagueTopScorers(container,isAssists){
  var type=isAssists?'topassists':'topscorers';
  var k='jeScores_league_'+type+'_'+curLeague.id+'_'+curLeagueSeason;
  var cached=getCache(k);
  if(cached){renderLeagueTop(cached,container,isAssists,true); if(cacheAge(k)>3600000) fetchLeagueTop(k,container,isAssists);}
  else {container.innerHTML='<div class="empty">Loading '+(isAssists?'assists':'top scorers')+'...</div>'; fetchLeagueTop(k,container,isAssists);}
}
function fetchLeagueTop(k,container,isAssists){
  var endpoint=isAssists?'players/topassists':'players/topscorers';
  var lk=leagueKey(),lid=curLeague.id,season=curLeagueSeason;
  fetchDedup(W+"/v3/"+endpoint+"?league="+encodeURIComponent(lid)+"&season="+encodeURIComponent(season)).then(function(d){
    setCache(k,respArr(d));
    if(!leagueLive(lk)) return;
    renderLeagueTop(respArr(d),container,isAssists,false);
  }).catch(function(e){
    if(!leagueLive(lk)) return;
    var c=getCache(k);
    if(c) renderLeagueTop(c,container,isAssists,true);
    else container.innerHTML='<div class="empty"><b>No '+(isAssists?'assist':'scorer')+' data</b><br>Provider may not support for this league/season<br>'+esc(e.message)+'</div>';
  });
}
function renderLeagueTop(data,container,isAssists,fromCache){
  if(!data || data.length==0){container.innerHTML='<div class="empty"><b>No '+(isAssists?'assist':'scorer')+' data available</b><br>'+esc(curLeague.name)+' • '+nid(curLeagueSeason)+'<br>Try another season</div>'; return;}
  var html=(fromCache?'<div style="text-align:center;font-size:8px;color:#555;padding:3px">Cached</div>':'');
  html+='<div style="padding:4px 0"><b style="color:var(--gold);font-size:11px">'+(isAssists?'Top Assists':'Top Scorers')+' • '+esc(curLeague.name)+' • '+nid(curLeagueSeason)+'</b></div>';
  html+='<div class="league-card" style="padding:0"><table class="standings-table"><tr><th>#</th><th>Player</th><th>Team</th><th>'+(isAssists?'A':'G')+'</th><th>'+(isAssists?'G+A':'A')+'</th></tr>';
  data.slice(0,20).forEach(function(p,i){
    var stat=(p.statistics&&p.statistics[0])||{team:{},goals:{}};
    var goals=(stat.goals&&stat.goals.total)||0;
    var assists=(stat.goals&&stat.goals.assists)||0;
    var mainVal=isAssists?assists:goals;
    var secondVal=isAssists?goals:assists;
    var photo=safeUrl(p.player.photo)||teamLogo(stat.team&&stat.team.id);
    html+='<tr><td>'+(i+1)+'</td><td><div style="display:flex;align-items:center;gap:6px"><img src="'+esc(photo)+'" alt="" style="width:20px;height:20px;border-radius:50%;object-fit:cover"><span style="font-weight:700">'+esc(p.player.name)+'</span></div><div style="font-size:8px;color:#888">'+esc(p.player.nationality||'')+' • '+esc(p.player.age||'')+'y</div></td><td><div style="display:flex;align-items:center;gap:4px"><img src="'+teamLogo(stat.team&&stat.team.id)+'" alt="" style="width:14px;height:14px"><span style="font-size:10px">'+esc(stat.team&&stat.team.name)+'</span></div></td><td style="font-weight:900;color:var(--gold)">'+esc(mainVal)+'</td><td style="color:#aaa">'+esc(secondVal)+'</td></tr>';
  });
  html+='</table></div><div style="font-size:8px;color:#666;padding:6px">G=Goals A=Assists • Real data from API-Football • Tap player row for profile (coming soon)</div>';
  container.innerHTML=html;
}

/* more */
function loadMorePage(){
  var main=document.getElementById('main');
  var html='<div style="padding:8px 0"><b style="color:var(--gold)">☰ More • jeScores</b><div style="font-size:9px;color:#888">Every Goal. Every Update.</div></div>';
  html+='<div class="league-card"><div class="league-head" role="button" tabindex="0" data-act="topscorers"><b>⚽ Top Scorers - Top 5 Leagues</b><span style="color:var(--gold)" aria-hidden="true">→</span></div></div>';
  html+='<div class="league-card"><div class="league-head" role="button" tabindex="0" data-act="searchgo"><b>🔍 Search Teams & Leagues</b><span style="color:var(--gold)" aria-hidden="true">→</span></div></div>';
  html+='<div class="league-card"><div class="league-head" style="flex-direction:column;align-items:flex-start;gap:6px;padding:12px;cursor:default">';
  html+='<div style="display:flex;align-items:center;gap:10px"><div style="width:40px;height:40px;background:linear-gradient(135deg,var(--green),var(--green2));border:1px solid var(--gold);border-radius:10px;display:grid;place-items:center;font-weight:900;color:var(--gold)">J</div><div><b style="font-size:14px">jeScores</b><div style="font-size:9px;color:var(--gold);letter-spacing:1px">BY JESSENDINHO</div><div style="font-size:8px;color:#888;font-style:italic">Every Goal. Every Update.</div></div></div>';
  html+='<div style="font-size:11px;color:#aaa;line-height:1.6;margin-top:8px">Your fast, reliable football live scores app.<br><br>• Live scores & results<br>• Goal scorers & minutes<br>• Lineups, stats & events<br>• Standings & fixtures<br>• Top leagues worldwide<br>• Follow your teams<br><br><span style="font-size:10px;color:#666">© 2026 jeScores by JESSENDINHO</span></div>';
  html+='</div></div>';
  html+='<div class="league-card"><div class="league-head" role="button" tabindex="0" data-act="clearcache"><b>🗑️ Clear Cache</b><span style="color:var(--muted)" aria-hidden="true">→</span></div></div>';
  main.innerHTML=html;
}
function loadTopScorersHub(){
  var main=document.getElementById('main'),seq=++pageSeq;
  main.innerHTML='<div class="empty"><b>Top Scorers</b><br>Loading...</div>';
  var ids=[39,140,135,78,61];
  var season=new Date().getFullYear(); if(new Date().getMonth()<7) season--;
  var promises=ids.map(function(id){return fetchDedup(W+"/v3/players/topscorers?league="+id+"&season="+season).then(function(d){return {id:id,data:respArr(d)};}).catch(function(){return {id:id,data:[]};});});
  Promise.all(promises).then(function(results){
    if(seq!==pageSeq||curPage!='more') return;
    var names={39:'EPL',140:'La Liga',135:'Serie A',78:'Bundesliga',61:'Ligue 1'};
    var html='<div class="league-card"><div class="league-head" style="cursor:default"><b>⚽ Top Scorers • Top 5 • '+season+'/'+(season+1)+'</b><span role="button" tabindex="0" data-act="more" style="color:var(--gold);cursor:pointer">← Back</span></div></div>';
    var any=false;
    results.forEach(function(r){
      if(r.data.length==0) return;
      any=true;
      html+='<div class="league-card" style="padding:10px"><b style="color:var(--gold)">'+esc(names[r.id])+'</b><table class="standings-table"><tr><th>Player</th><th>Team</th><th>G</th></tr>';
      r.data.slice(0,5).forEach(function(p){var st=(p.statistics&&p.statistics[0])||{team:{},goals:{}};html+='<tr><td style="font-weight:700">'+esc(p.player.name)+'</td><td>'+esc(st.team&&st.team.name)+'</td><td style="color:var(--gold);font-weight:900">'+esc((st.goals&&st.goals.total)||0)+'</td></tr>';});
      html+='</table></div>';
    });
    if(!any) html+='<div class="empty"><b>No scorer data available</b><br>Try again later</div>';
    main.innerHTML=html;
  });
}

/* ---------- event delegation (replaces inline onclick strings) ---------- */
document.addEventListener('click',function(e){
  var el=e.target&&e.target.closest?e.target.closest('[data-act]'):null;
  if(!el) return;
  var a=el.getAttribute('data-act');
  if(a=='page') setPage(el.getAttribute('data-page'));
  else if(a=='date') setDateOffset(parseInt(el.getAttribute('data-off'),10));
  else if(a=='pickdate') pickDate();
  else if(a=='toggle') toggleLeague(el.getAttribute('data-id'));
  else if(a=='match') openDetail(el.getAttribute('data-id'));
  else if(a=='closedetail') closeDetail();
  else if(a=='tab') setTab(el.getAttribute('data-tab'));
  else if(a=='follow') followTeam(nid(el.getAttribute('data-id')),el.getAttribute('data-name'));
  else if(a=='clearfollowing') clearFollowing();
  else if(a=='league') openLeague(nid(el.getAttribute('data-id')));
  else if(a=='leaguesback') loadLeaguesHub();
  else if(a=='ltab') switchLeagueTab(el.getAttribute('data-tab'));
  else if(a=='retrymatches') loadMatches(true);
  else if(a=='retrynews') loadNews();
  else if(a=='retryleagues') loadLeaguesHub();
  else if(a=='retryleague') loadLeagueTabData();
  else if(a=='topscorers') loadTopScorersHub();
  else if(a=='more') loadMorePage();
  else if(a=='searchgo'){setPage('matches');document.getElementById('q').focus();}
  else if(a=='clearcache'){
    if(confirm('Clear cached match data? Your followed teams will be kept.')){clearJeScoresCache();alert('Cache cleared');}
  }
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t&&t.getAttribute&&t.getAttribute('data-change')=='season') changeSeason(t.value);
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){
    if(document.getElementById('detail').classList.contains('show')) closeDetail();
    return;
  }
  if(e.key!=='Enter' && e.key!==' ') return;
  var el=e.target;
  if(!el||!el.getAttribute||el.getAttribute('role')===null||el.tagName==='BUTTON'||el.tagName==='INPUT'||el.tagName==='SELECT') return;
  if(el.hasAttribute('data-act')){e.preventDefault();el.click();}
});
/* Hide broken images (logos / photos) without inline handlers */
document.addEventListener('error',function(e){
  if(e.target&&e.target.tagName==='IMG') e.target.style.display='none';
},true);

/* ---------- start ---------- */
buildDateTabs();
document.getElementById('datePicker').value=localDateStr(curDate);
document.getElementById('tb-overview').setAttribute('aria-selected','true');
document.getElementById('nav-matches').setAttribute('aria-current','page');
loadMatches(false);
function refreshToday(){
  if(curPage=='matches' && document.visibilityState=='visible'){
    var dateStr=localDateStr(curDate);
    if(isTodayStr(dateStr)) fetchFresh(dateStr,FIX_PREFIX+dateStr);
  }
}
setInterval(refreshToday,30000);
document.addEventListener('visibilitychange',refreshToday);

/* Register only the jeScores service worker. No global unregistering and no deleting of other caches. */
if('serviceWorker' in navigator){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('./sw.js').catch(function(){});
  });
}
</script>
